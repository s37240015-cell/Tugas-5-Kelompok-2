<!DOCTYPE html>
<html lang="en">
    <head>
        <title>
            Tugas 5
        </title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

        <style>
            .box {
                display: flex;
                flex-direction: column;
                row-gap: 12px;
                padding: 24px 144px;
            }
            .name-holder {
                width: 100%;
                background-color: hsl(237, 15%, 23%);
                border-radius: 8px;
                box-shadow: 0px 6px 2px -2px hsl(0, 0%, 40%);
            }
            .name {
                text-align: center;
                font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
                text-shadow: 0px 0px 4px hsl(0, 0%, 100%);
                font-size: 1.6vw;
                color: hsl(240, 29%, 93%);
                padding: 8px;
            }
            .foto-holder {
                display: flex;
                justify-content: center;
                border: 3.6px solid hsl(237, 15%, 23%);
                border-radius: 8px;
                background: linear-gradient(to bottom right, hsl(255, 100%, 74%), hsl(208, 98%, 76%), hsl(164, 100%, 79%));
                box-shadow: inset 0px 0px 24px hsl(164, 100%, 79%);
            }
            .foto {
                filter: invert(100%);
                width: 50%;
            }
        </style>
    </head>
    <body>
        <div class="box">
            <div class="name-holder">
                <div class="name">
                    <b>Developer: Cardion</b>
                </div>
            </div>
            <div class="foto-holder">
                <img class="foto" src="Foto/photo4.png" alt="foto">
            </div>
        </div>
    </body>
</html>
