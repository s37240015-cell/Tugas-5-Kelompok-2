<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Miss Thami</title>
    <style>
        body {
            background-color: hsl(0, 20%, 97%);
            font-family: Georgia, serif;
        }
        .card {
            width: 300px;
            margin: 40px auto;
        }
        .label {
            font-size: 1rem;
            text-align: center;
            color: hsl(0, 75%, 18%);
            background-color: hsl(0, 60%, 95%);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            text-shadow: 2px 2px 5px hsla(0, 60%, 12%, 0.25);
            box-shadow: 2px 2px 5px hsla(0, 50%, 25%, 0.2);
        }
        .photo {
            height: 400px;
            border-radius: 10px;
            overflow: hidden;
            background: linear-gradient(to bottom, hsl(0, 40%, 95%), hsl(0, 70%, 20%));
            box-shadow: 5px 5px 10px hsla(0, 60%, 15%, 0.3);
        }
        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.0) saturate(1.0) brightness(0.98);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 class="label">Developer: Lilie</h1>
        <div class="photo">
            <img src="D:\zee-jkt48_169.PNG" alt="Foto Lilie">
        </div>
    </div>
</body>
</html>
